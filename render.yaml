# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect repo, or `render blueprint launch`

services:
  # Game API + Socket.IO
  - type: web
    name: rune-race-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install --frozen-lockfile &&
      pnpm build:shared &&
      pnpm build:game-engine &&
      pnpm build:server
    startCommand: cd apps/server && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

  # Vite static client (React + R3F)
  - type: web
    name: rune-race-web
    runtime: static
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install --frozen-lockfile &&
      pnpm build:shared &&
      pnpm build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rune-race-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
