# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect repo, or `render blueprint launch`
#
# rune-race-api wires CLIENT_ORIGIN + ADMIN_ORIGIN from static sites (CORS + Socket.IO).

services:
  # Game API + Socket.IO
  - type: web
    name: rune-race-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      corepack prepare pnpm@latest --activate &&
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm build:shared &&
      corepack pnpm build:game-engine &&
      corepack pnpm build:server
    startCommand: cd apps/server && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: rune-race
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_ORIGIN
        fromService:
          type: web
          name: rune-race-admin
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_USER_IDS
        sync: false

  # Vite static client (React + R3F)
  - type: web
    name: rune-race
    runtime: static
    buildCommand: >-
      corepack prepare pnpm@latest --activate &&
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm build:shared &&
      corepack pnpm build:game-engine &&
      corepack pnpm build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rune-race-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SITE_URL
        fromService:
          type: web
          name: rune-race
          envVarKey: RENDER_EXTERNAL_URL

  # Internal admin dashboard (analytics, feature flags)
  - type: web
    name: rune-race-admin
    runtime: static
    buildCommand: >-
      corepack prepare pnpm@latest --activate &&
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm build:admin
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rune-race-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
